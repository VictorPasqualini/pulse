<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Finanças</title>
        <link rel="stylesheet" href="../static/css/style.css"> 

        <h2>Bem-vindo, {{ nome }}</h2>
<a href="{{ url_for('logout') }}">Sair</a>
    </head>
    <body>
        <h1>Lançamento Financeiro</h1>
        <form action="/save_controle_financa" method="post">

         <!-- Entrada -->
            <fieldset>
                <legend>Valor</legend>
                
                <label>Descrição:</label><br>
                <input type="text" name="descricao" required><br><br>

                <label>Valor da Transação (R$):</label><br>
                <input type="text" id="valor" name="valor" step="1.00" required><br><br>
                <script src="{{ url_for('static', filename='../static/js/formatter_field_utils.js') }}"></script>
                
                <label>Tipo de Transação</label><br>
                <select name="tipo" required>
                    <option>Selecione</option>
                    <option>Entrada</option>
                    <option>Saída</option>
                </select><br><br>
                
                <label>Data da Transação:</label><br>
                <input type="date" name="data" required><br><br>
                
                <button type="submit">Enviar</button> 

            </fieldset>

        </form>
    </body>
</html>
